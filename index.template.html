<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Este arquivo é GERADO por scripts/gerar-empresas.mjs a partir de index.template.html +
     empresas.json. Não edite index.html nem empresas/*/index.html diretamente — a próxima
     geração sobrescreve. Edite o template ou o manifesto e rode o script de novo. -->
<title>{{TITLE}} — ERP Integrado</title>
<link rel="icon" type="image/svg+xml" href="{{ASSET_PREFIX}}favicon.svg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,500,400&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
/* Art direction: ERP para lanchonete -> pragmático, apetitoso, confiável
   Palette: neutros quentes (creme/carvão) + acento âmbar-brasa (comida, energia, atenção)
   Typography: Cabinet Grotesk (display) + General Sans (body) - moderno, redondo, legível
   Density: densa (dashboard operacional) */
:root, [data-theme="light"]{
  --color-bg:#f8f5f0; --color-surface:#fbf9f5; --color-surface-2:#fdfcfa;
  --color-surface-offset:#f1ecE4; --color-surface-offset-2:#e9e2d7; --color-surface-dynamic:#e2d9cb;
  --color-divider:#ddd4c4; --color-border:#d2c7b3;
  --color-text:#2b241a; --color-text-muted:#786b58; --color-text-faint:#b3a893; --color-text-inverse:#fbf6ee;
  --color-primary:#c1440e; --color-primary-hover:#9c360a; --color-primary-active:#7a2a08; --color-primary-highlight:#f0d8c8;
  --color-warning:#96601b; --color-warning-hover:#754a14; --color-warning-highlight:#e6d3b3;
  --color-error:#a8283a; --color-error-hover:#821f2d; --color-error-highlight:#e6c9cd;
  --color-success:#3e7a35; --color-success-hover:#2f5e28; --color-success-highlight:#cfe0c9;
  --color-notification:#a8283a; --color-notification-highlight:#e6c9cd;
  --color-gold:#b8860b; --color-gold-highlight:#ecdcae;
  --color-blue:#2c6e8e; --color-blue-highlight:#c9dde6;
  --color-purple:#6b4a8e; --color-purple-highlight:#dcd2e6;
  --radius-sm:0.375rem; --radius-md:0.5rem; --radius-lg:0.75rem; --radius-xl:1rem; --radius-full:9999px;
  --transition-interactive:180ms cubic-bezier(0.16,1,0.3,1);
  --shadow-sm:0 1px 2px oklch(0.2 0.02 40 / 0.08); --shadow-md:0 4px 12px oklch(0.2 0.02 40 / 0.10); --shadow-lg:0 12px 32px oklch(0.2 0.02 40 / 0.16);
  --font-display:'Cabinet Grotesk','Georgia',serif; --font-body:'General Sans','Helvetica Neue',sans-serif;
}
[data-theme="dark"]{
  --color-bg:#1a1611; --color-surface:#211c15; --color-surface-2:#262019;
  --color-surface-offset:#292319; --color-surface-offset-2:#332b1f; --color-surface-dynamic:#3d3324;
  --color-divider:#3a3223; --color-border:#4a3f2c;
  --color-text:#eee7d9; --color-text-muted:#a89a80; --color-text-faint:#7a6d56; --color-text-inverse:#2b241a;
  --color-primary:#e5793a; --color-primary-hover:#f0925a; --color-primary-active:#c1440e; --color-primary-highlight:#4a3220;
  --color-warning:#d3a04a; --color-warning-hover:#e3b566; --color-warning-highlight:#4a3a1e;
  --color-error:#e07084; --color-error-hover:#e88fa0; --color-error-highlight:#4a2530;
  --color-success:#7cbb6c; --color-success-hover:#96cc88; --color-success-highlight:#2a3d24;
  --color-notification:#e07084; --color-notification-highlight:#4a2530;
  --color-gold:#e0b23f; --color-gold-highlight:#453a1c;
  --color-blue:#5ea3c4; --color-blue-highlight:#233a45;
  --color-purple:#a583c9; --color-purple-highlight:#352a45;
  --shadow-sm:0 1px 2px oklch(0 0 0/0.3); --shadow-md:0 4px 12px oklch(0 0 0/0.4); --shadow-lg:0 12px 32px oklch(0 0 0/0.5);
}
:root{
  --text-xs:clamp(0.75rem,0.7rem+0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem+0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem+0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem+0.75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem+1.25vw,2.25rem);
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-5:1.25rem;--space-6:1.5rem;
  --space-8:2rem;--space-10:2.5rem;--space-12:3rem;--space-16:4rem;--space-20:5rem;--space-24:6rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth;}
body{min-height:100dvh;line-height:1.5;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);}
img,svg{display:block;max-width:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
h1,h2,h3,h4{font-family:var(--font-display);text-wrap:balance;line-height:1.15;font-weight:700;}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-sm);}
table{border-collapse:collapse;width:100%;font-size:var(--text-sm);}
.tabular{font-variant-numeric:tabular-nums lining-nums;}
button{cursor:pointer;background:none;border:none;}
a{color:inherit;text-decoration:none;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* LAYOUT */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100dvh;}
.sidebar{background:var(--color-surface);border-right:1px solid var(--color-divider);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow-y:auto;z-index:20;}
.sidebar-brand{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-5) var(--space-4);border-bottom:1px solid var(--color-divider);}
.sidebar-brand h1{font-size:var(--text-base);color:var(--color-primary);}
.nav-group{padding:var(--space-3) var(--space-2);}
.nav-group-label{font-size:var(--text-xs);color:var(--color-text-faint);text-transform:uppercase;letter-spacing:0.05em;padding:var(--space-2) var(--space-3);font-weight:600;}
.nav-item{display:flex;align-items:center;gap:var(--space-2);width:100%;text-align:left;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text-muted);transition:var(--transition-interactive);min-height:40px;}
.nav-item:hover{background:var(--color-surface-offset);color:var(--color-text);}
.nav-item.active{background:var(--color-primary-highlight);color:var(--color-primary-hover);font-weight:600;}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.main{min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in oklab, var(--color-bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);gap:var(--space-4);}
.topbar h2{font-size:var(--text-xl);}
.topbar-actions{display:flex;align-items:center;gap:var(--space-3);}
.content{padding:var(--space-6);flex:1;}
.view{display:none;}
.view.active{display:block;animation:fadein 220ms cubic-bezier(0.16,1,0.3,1);}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* COMPONENTS */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:600;transition:var(--transition-interactive);min-height:40px;white-space:nowrap;}
.btn-primary{background:var(--color-primary);color:var(--color-text-inverse);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-secondary{background:var(--color-surface-offset);color:var(--color-text);border:1px solid var(--color-border);}
.btn-secondary:hover{background:var(--color-surface-offset-2);}
.btn-ghost{color:var(--color-text-muted);}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text);}
.btn-sm{padding:var(--space-1) var(--space-3);min-height:32px;font-size:var(--text-xs);}
.btn-danger{background:var(--color-error-highlight);color:var(--color-error-hover);}
.btn-danger:hover{background:var(--color-error);color:var(--color-text-inverse);}
.card{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / 0.08);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-sm);}
.card:hover{box-shadow:var(--shadow-md);}
.grid{display:grid;gap:var(--space-4);}
.grid-kpi{grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));}
.kpi-card{display:flex;flex-direction:column;gap:var(--space-1);}
.kpi-label{font-size:var(--text-xs);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.03em;font-weight:600;}
.kpi-value{font-size:var(--text-xl);font-family:var(--font-display);}
.kpi-sub{font-size:var(--text-xs);color:var(--color-text-faint);}
.kpi-sub.pos{color:var(--color-success);} .kpi-sub.neg{color:var(--color-error);}
.badge{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;}
.badge-success{background:var(--color-success-highlight);color:var(--color-success-hover);}
.badge-warning{background:var(--color-warning-highlight);color:var(--color-warning-hover);}
.badge-error{background:var(--color-error-highlight);color:var(--color-error-hover);}
.badge-neutral{background:var(--color-surface-offset);color:var(--color-text-muted);}
.badge-primary{background:var(--color-primary-highlight);color:var(--color-primary-hover);}
.section-title{font-size:var(--text-lg);margin-bottom:var(--space-4);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;}
.input,.select,textarea.input{width:100%;padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-2);font-size:var(--text-sm);min-height:40px;}
.input:focus,.select:focus{border-color:var(--color-primary);}
.label{font-size:var(--text-xs);color:var(--color-text-muted);font-weight:600;margin-bottom:var(--space-1);display:block;}
.field{margin-bottom:var(--space-3);}
.form-row{display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--color-divider);}
th{text-align:left;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:0.03em;color:var(--color-text-muted);padding:var(--space-3);background:var(--color-surface-offset);border-bottom:1px solid var(--color-divider);white-space:nowrap;}
td{padding:var(--space-3);border-bottom:1px solid var(--color-divider);font-size:var(--text-sm);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--color-surface-offset);}
.modal-overlay{position:fixed;inset:0;background:oklch(0.15 0.02 40/0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:var(--space-4);}
.modal-overlay.active{display:flex;}
.modal{background:var(--color-surface-2);border-radius:var(--radius-xl);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:var(--space-5);border-bottom:1px solid var(--color-divider);position:sticky;top:0;background:var(--color-surface-2);}
.modal-body{padding:var(--space-5);}
.modal-footer{display:flex;justify-content:flex-end;gap:var(--space-2);padding:var(--space-5);border-top:1px solid var(--color-divider);}
.pill-toggle{display:flex;gap:var(--space-1);background:var(--color-surface-offset);border-radius:var(--radius-full);padding:2px;width:fit-content;}
.pill-toggle button{padding:var(--space-1) var(--space-4);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);}
.pill-toggle button.active{background:var(--color-surface-2);color:var(--color-text);box-shadow:var(--shadow-sm);}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:var(--space-3);overflow-x:auto;padding-bottom:var(--space-3);}
.kanban-col{background:var(--color-surface-offset);border-radius:var(--radius-lg);padding:var(--space-3);min-width:220px;}
.kanban-col h4{font-size:var(--text-xs);text-transform:uppercase;color:var(--color-text-muted);margin-bottom:var(--space-3);display:flex;justify-content:space-between;}
.kanban-card{background:var(--color-surface-2);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-2);box-shadow:var(--shadow-sm);cursor:grab;font-size:var(--text-sm);}
.kanban-card:hover{box-shadow:var(--shadow-md);}
.kanban-card .pedido-id{font-weight:700;color:var(--color-primary);font-size:var(--text-xs);}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--space-16) var(--space-8);color:var(--color-text-muted);}
.empty-state svg{width:48px;height:48px;margin-bottom:var(--space-4);color:var(--color-text-faint);}
.alert-item{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-surface-offset);margin-bottom:var(--space-2);font-size:var(--text-sm);}
.divider{height:1px;background:var(--color-divider);margin:var(--space-4) 0;}
.progress-bar{height:6px;background:var(--color-surface-offset-2);border-radius:var(--radius-full);overflow:hidden;}
.progress-bar > div{height:100%;background:var(--color-primary);border-radius:var(--radius-full);transition:width 300ms;}
.toast-wrap{position:fixed;bottom:var(--space-6);right:var(--space-6);z-index:200;display:flex;flex-direction:column;gap:var(--space-2);}
.toast{background:var(--color-text);color:var(--color-bg);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);box-shadow:var(--shadow-lg);animation:toastin 220ms cubic-bezier(0.16,1,0.3,1);max-width:320px;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.tag-list{display:flex;flex-wrap:wrap;gap:var(--space-1);}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--color-text-muted);}
.icon-btn:hover{background:var(--color-surface-offset);color:var(--color-text);}
.icon-btn svg{width:18px;height:18px;}
.hidden{display:none !important;}
.text-muted{color:var(--color-text-muted);}
.text-faint{color:var(--color-text-faint);}
.text-primary{color:var(--color-primary);}
.text-success{color:var(--color-success);}
.text-error{color:var(--color-error);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;} .gap-2{gap:var(--space-2);} .gap-3{gap:var(--space-3);}
.mb-2{margin-bottom:var(--space-2);} .mb-3{margin-bottom:var(--space-3);} .mb-4{margin-bottom:var(--space-4);}
.w-full{width:100%;}
@media (max-width:1024px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;transform:translateX(-100%);transition:transform 240ms;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .kanban{grid-template-columns:repeat(6,240px);}
}
@media (max-width:640px){
  .content{padding:var(--space-4);}
  .topbar{padding:var(--space-3) var(--space-4);}
  .grid-kpi{grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));}
}
/* AUTENTICAÇÃO */
#appRoot.hidden{display:none;}
#authScreen{display:none;}
#authScreen.active{display:block;}
.auth-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--space-6);background:var(--color-bg);}
.auth-card{width:100%;max-width:400px;}
.auth-logo{display:flex;align-items:center;gap:var(--space-2);justify-content:center;margin-bottom:var(--space-6);}
.auth-logo h1{font-size:var(--text-lg);color:var(--color-primary);}
</style>
</head>
<body>
<div class="app hidden" id="appRoot">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="flex items-center gap-3">
        <button class="icon-btn" id="menuToggle" aria-label="Abrir menu" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <h2 id="viewTitle">Dashboard</h2>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="premiumIndicator" aria-label="Status do Premium"></button>
        <span class="text-muted" id="usuarioLogadoLabel" style="font-size:var(--text-xs)"></span>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">Sair</button>
        <button class="icon-btn" id="themeToggle" aria-label="Alternar tema"></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="authScreen"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
{{CONFIG_SCRIPT}}
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="{{ASSET_PREFIX}}app.js" defer></script>
</body>
</html>
